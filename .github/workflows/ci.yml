name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      OMP_THREAD_LIMIT: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install and check dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Run tests
        run: timeout --kill-after=15s 5m python -m pytest -ra --tb=long -o faulthandler_timeout=45
      - name: Build local image
        run: docker build --tag intelligent-ticket-triage:ci .
      - name: Train and smoke-test the image
        run: python scripts/ci_smoke.py --image intelligent-ticket-triage:ci
      - name: Scan image OS and runtime dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: intelligent-ticket-triage:ci
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"
          timeout: 5m
          cache: false
