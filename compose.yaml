x-triage-image: &triage-image
  build: .
  image: intelligent-ticket-triage:phase2

services:
  api:
    <<: *triage-image
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ${SLA_MODEL_BUNDLE:?Set SLA_MODEL_BUNDLE to a trusted run directory}
        target: /app/model_bundle
        read_only: true
        bind:
          create_host_path: false
  ui:
    <<: *triage-image
    command: ["streamlit", "run", "app/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.gatherUsageStats=false"]
    environment:
      SLA_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:8501:8501"
